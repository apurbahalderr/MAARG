<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MAARG - Intelligent Route Planning</title>

    <link rel="stylesheet" href="style.css">

    <!-- Mappls Web Maps SDK -->
    <script src="https://sdk.mappls.com/map/sdk/web?v=3.0&access_token=miunpnbpteyzxhdjjmwejxfdyxuikkumudgr"></script>
</head>

<body>

    <header>
        <h1>MAARG</h1>
        <p>Intelligent Logistics Route Planning</p>
    </header>

    <div class="controls">

        <input
            type="text"
            id="source"
            placeholder="Enter source"
        >

        <input
            type="text"
            id="destination"
            placeholder="Enter destination"
        >

        <button id="routeBtn">
            Find Routes
        </button>

    </div>

    <div id="map"></div>
<div id="route-cards"></div>

    <script src="app.js"></script>

</body>

</html>
